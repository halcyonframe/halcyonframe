# Builds the firmware on every push and pull request. A version tag (v1.2.0) also publishes a release with:
#   halcyonframe.bin       app image: install from the frame's Settings > Firmware, or as firmware.bin on the card
#   halcyonframe-full.bin  bootloader + partitions + app at offset 0: USB / web installer for new or bricked frames
#
# People flash these files onto their frames, so the workflow is kept tight: actions are pinned to commit
# SHAs (Dependabot proposes updates), the build job can only read, and only the tag-triggered release job can
# write to the repo. Not pinned: the espressif/idf:v5.5.1 build image, which the ESP-IDF action pulls by tag.
# Releases include SHA256SUMS so downloads can be checked.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so `git describe` gives the firmware its version string
          persist-credentials: false
      # ESP-IDF takes the firmware version from version.txt when present. Writing it here, outside the build
      # container, avoids git's "dubious ownership" refusal inside it.
      - name: Version
        run: git describe --tags --always --dirty > firmware/version.txt && cat firmware/version.txt
      - name: Build
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware
          # The notices go next to the binaries so the artifact is flat (the release job expects plain names).
          command: idf.py build && cp ../THIRD_PARTY_NOTICES.md build/ && cd build && esptool.py --chip esp32s3 merge_bin -o halcyonframe-full.bin @flash_args
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            firmware/build/halcyonframe.bin
            firmware/build/halcyonframe-full.bin
            firmware/build/THIRD_PARTY_NOTICES.md

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
      - name: Checksums
        run: sha256sum halcyonframe.bin halcyonframe-full.bin > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            halcyonframe.bin
            halcyonframe-full.bin
            SHA256SUMS
            THIRD_PARTY_NOTICES.md
          generate_release_notes: true
